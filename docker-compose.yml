services:
  student-db:
    image: postgres:15
    container_name: student-db
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: password
      POSTGRES_DB: students
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-net

  student-profile:
    build: ./student-profile
    container_name: student-profile
    environment:
      DATABASE_URL: postgresql://student:password@student-db:5432/students
      FLASK_ENV: development
    depends_on:
      - student-db
    ports:
      - "5001:5001"
    networks:
      - microservices-net

  admin-frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - student-profile
    networks:
      - microservices-net

  course-db:
    image: postgres:15
    environment:
      POSTGRES_DB: course_db
      POSTGRES_USER: course_user
      POSTGRES_PASSWORD: course_password
    volumes:
      - ./course-catalogue/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - microservices-net

  course-catalogue:
    build: ./course-catalogue
    ports:
      - "5002:5002"
    environment:
      DATABASE_URL: postgresql://course_user:course_password@course-db:5432/course_db
    depends_on:
      - course-db
    networks:
      - microservices-net

  notification-db:
    image: postgres:15
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./notification/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - microservices-net

  notification:
    build: ./notification
    depends_on:
      - notification-db
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@notification-db:5432/notification_db"
    ports:
      - "5004:5004"
    networks:
      - microservices-net

  feedback-db:
    image: postgres:15
    environment:
      POSTGRES_DB: feedback_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./feedback/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - microservices-net

  feedback:
    build: ./feedback
    depends_on:
      - feedback-db
      - student-profile
      - course-catalogue
      - notification
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@feedback-db:5432/feedback_db"
      STUDENT_PROFILE_URL: "http://student-profile:5001"
      COURSE_CATALOGUE_URL: "http://course-catalogue:5002"
      NOTIFICATION_URL: "http://notification:5004"
    ports:
      - "5003:5003"
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
