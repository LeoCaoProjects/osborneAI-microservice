services:
  student-db:
    image: postgres:15
    container_name: student-db
    environment:
      POSTGRES_USER: ${STUDENT_DB_USER}
      POSTGRES_PASSWORD: ${STUDENT_DB_PASSWORD}
      POSTGRES_DB: ${STUDENT_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./services/student-profile/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-net

  student-profile:
    build: ./services/student-profile
    container_name: student-profile
    environment:
      DATABASE_URL: "postgresql://${STUDENT_DB_USER}:${STUDENT_DB_PASSWORD}@student-db:5432/${STUDENT_DB_NAME}"
      FLASK_ENV: development
    depends_on:
      - student-db
    ports:
      - "5001:5001"
    networks:
      - microservices-net

  admin-frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - student-profile
    networks:
      - microservices-net

  course-db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${COURSE_DB_NAME}
      POSTGRES_USER: ${COURSE_DB_USER}
      POSTGRES_PASSWORD: ${COURSE_DB_PASSWORD}
    volumes:
      - ./services/course-catalogue/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - microservices-net

  course-catalogue:
    build: ./services/course-catalogue
    ports:
      - "5002:5002"
    environment:
      DATABASE_URL: "postgresql://${COURSE_DB_USER}:${COURSE_DB_PASSWORD}@course-db:5432/${COURSE_DB_NAME}"
    depends_on:
      - course-db
    networks:
      - microservices-net

  notification-db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - ./services/notification/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - microservices-net

  notification:
    build: ./services/notification
    depends_on:
      - notification-db
    environment:
      DATABASE_URL: "postgresql://${NOTIFICATION_DB_USER}:${NOTIFICATION_DB_PASSWORD}@notification-db:5432/${NOTIFICATION_DB_NAME}"
    ports:
      - "5004:5004"
    networks:
      - microservices-net

  feedback-db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${FEEDBACK_DB_NAME}
      POSTGRES_USER: ${FEEDBACK_DB_USER}
      POSTGRES_PASSWORD: ${FEEDBACK_DB_PASSWORD}
    volumes:
      - ./services/feedback/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - microservices-net

  feedback:
    build: ./services/feedback
    depends_on:
      - feedback-db
      - student-profile
      - course-catalogue
      - notification
    environment:
      DATABASE_URL: "postgresql://${FEEDBACK_DB_USER}:${FEEDBACK_DB_PASSWORD}@feedback-db:5432/${FEEDBACK_DB_NAME}"
      STUDENT_PROFILE_URL: ${STUDENT_PROFILE_URL}
      COURSE_CATALOGUE_URL: ${COURSE_CATALOGUE_URL}
      NOTIFICATION_URL: ${NOTIFICATION_URL}
    ports:
      - "5003:5003"
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge